services:
  # Database - starts first
  postgres:
    image: postgres:16-alpine
    container_name: codequest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codequest
      POSTGRES_PASSWORD: codequest
      POSTGRES_DB: codequest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codequest -d codequest"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres_test:
    image: postgres:16-alpine
    container_name: codequest-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: codequest_test
      POSTGRES_PASSWORD: codequest_test
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codequest_test -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend Server - starts after database is healthy
  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codequest-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://codequest:codequest@postgres:5432/codequest
      DATABASE_URL_SYNC: postgresql+psycopg://codequest:codequest@postgres:5432/codequest
      DATABASE_HOST: postgres
      APP_ENV: production
      DEBUG: "false"
      API_PREFIX: /api/v1
    depends_on:
      postgres:
        condition: service_healthy
    # Removed Docker healthcheck to avoid continuous polling by Docker daemon.
    # Server readiness is still used by the client via an explicit startup probe
    # implemented inside the client image (wait-for-server.sh).

  # Frontend Client - starts after server is healthy
  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: codequest-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server
    # Client exposes its own healthcheck but at a low frequency to avoid load
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:5173/"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  postgres_test_data:
